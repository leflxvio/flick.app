name: flick

services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4000}:80"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "4100"
      CORS_ORIGINS: "${CORS_ORIGINS:-https://flick.f-l.dev}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4100}:4100"
    init: true
    restart: unless-stopped

  cdn:
    build:
      context: .
      dockerfile: apps/cdn/Dockerfile
    ports:
      - "127.0.0.1:${CDN_PORT:-4200}:80"
    restart: unless-stopped
