server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    add_header Access-Control-Allow-Origin "*" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff;
        add_header Access-Control-Allow-Origin "*" always;
    }
}
